<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lantern Wall · Projector</title>
  <style>
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; cursor: none; }
    body.calibrating { cursor: default; }
    canvas { display: block; width: 100vw; height: 100vh; }
    .overlay {
      position: fixed; left: 16px; bottom: 16px; max-width: min(520px, calc(100vw - 32px));
      background: rgba(20, 16, 24, 0.88); color: #f2ecf4; border: 1px solid #463e50; border-radius: 12px;
      padding: 12px 16px; font: 14px/1.5 ui-sans-serif, system-ui, sans-serif;
      transition: opacity 0.4s;
    }
    .overlay.hide { opacity: 0; pointer-events: none; }
    .overlay kbd { background: #363040; border-radius: 6px; padding: 1px 7px; font-family: inherit; }
    .overlay b { color: #f4a64a; }
    .conn { position: fixed; right: 12px; top: 12px; width: 10px; height: 10px; border-radius: 50%; background: #ef6b6b; opacity: 0; transition: opacity 0.3s; }
    .conn.down { opacity: 1; }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div class="conn" id="conn" title="Disconnected from server"></div>
  <div class="overlay" id="help">
    <b>Projector</b> · <kbd>F</kbd> fullscreen · <kbd>C</kbd> calibrate
    <div id="calHelp" hidden>
      Drag a box to move it onto its lantern. Drag its bottom-right corner to resize.
      Arrow keys nudge the selected box (<kbd>Shift</kbd> for bigger steps).
      <kbd>S</kbd> save · <kbd>C</kbd> done
    </div>
    <div id="calStatus"></div>
  </div>

  <script src="shared.js"></script>
  <script src="projector.js"></script>
</body>
</html>
