<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#06050a">
  <title>Lantern Wall</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Caveat:wght@600&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,400;1,500&family=Figtree:wght@400;500;600&family=Fraunces:opsz,wght@9..144,600&display=swap">
  <link rel="stylesheet" href="controller.css?v=11097">
</head>
<body>
  <div class="sky" aria-hidden="true"></div>
  <div class="app">

    <!-- Shown only if config.js still has placeholder values -->
    <section class="screen center" id="screen-setup" hidden>
      <div class="card">
        <h1 class="brand">Lantern Wall</h1>
        <p id="setupMsg">This site isn't connected to Supabase yet. Put your project URL and anon key in <code>config.js</code>, then redeploy.</p>
      </div>
    </section>

    <!-- Screen 1: home. A live picture of the whole exhibit. The main lantern pulses: tap it to start. -->
    <section class="screen" id="screen-wall" hidden>
      <div class="wall-wrap" id="wallWrap">
        <div class="wall" id="wall">
          <canvas class="wall-art" id="wallCanvas" aria-hidden="true"></canvas>
        </div>
      </div>
      <div class="spot" id="spot" aria-hidden="true"></div>
      <div class="home-actions">
        <button type="button" class="prompt" id="homePrompt">Leave your light on the large lantern</button>
      </div>
    </section>

    <!-- Screen 2: editor -->
    <section class="screen" id="screen-editor" hidden>
      <header class="bar">
        <button type="button" class="btn ghost" id="back">← Back</button>
        <div class="tabs" id="tabs" role="tablist" aria-label="What to do">
          <button type="button" role="tab" data-mode="draw">Draw</button>
          <button type="button" role="tab" data-mode="text">Write</button>
          <button type="button" role="tab" data-mode="color">Light</button>
        </div>
        <button type="button" class="btn primary" id="send">Send to lantern</button>
      </header>

      <div class="ed-body">
        <div class="stage" id="stage">
          <div class="frame" id="frame">
            <canvas id="bg"></canvas>
            <canvas id="ink"></canvas>
            <canvas id="fx" aria-hidden="true"></canvas>
          </div>
          <p class="hint" id="hint"></p>
        </div>

        <aside class="tools">
          <!-- A: draw -->
          <div class="panel" id="tools-draw" hidden>
            <div class="group">
              <span class="label">Ink</span>
              <div class="swatches" id="inkSw"></div>
            </div>
            <div class="group">
              <span class="label">Stamps · tap one, then tap the lantern</span>
              <div class="stamps" id="stamps"></div>
            </div>
            <div class="group">
              <span class="label" id="sizeLabel">Brush size</span>
              <div class="row">
                <input type="range" id="size" min="4" max="60" value="16" aria-label="Brush size">
                <span class="size-dot"><i id="sizeDot"></i></span>
              </div>
            </div>
            <div class="row">
              <button type="button" class="chip" id="eraser" aria-pressed="false">Eraser</button>
              <button type="button" class="chip" id="undo">Undo</button>
              <button type="button" class="chip" id="clearDraw">Clear</button>
            </div>
          </div>

          <!-- B: text -->
          <div class="panel" id="tools-text" hidden>
            <div class="group">
              <label class="label" for="txt">Your message</label>
              <textarea id="txt" rows="3" maxlength="120" placeholder="Type something for the lantern"></textarea>
            </div>
            <div class="group">
              <span class="label">Font</span>
              <div class="row" id="fontChips"></div>
            </div>
            <div class="group">
              <span class="label">Text size</span>
              <input type="range" id="tsize" min="32" max="180" value="96" aria-label="Text size">
            </div>
            <div class="group">
              <span class="label">Text color</span>
              <div class="swatches" id="textSw"></div>
            </div>
            <div class="row">
              <button type="button" class="chip" id="clearText">Clear</button>
            </div>
          </div>

          <!-- C: light -->
          <div class="panel" id="tools-color" hidden>
            <div class="group">
              <span class="label">Light color</span>
              <div class="swatches big" id="glowSw"></div>
            </div>
            <div class="group">
              <span class="label">Custom</span>
              <label class="custom">
                <input type="color" id="customGlow" value="#b58cff" aria-label="Pick a custom light color">
                <span>Pick any color</span>
              </label>
            </div>
          </div>
        </aside>
      </div>
    </section>
  </div>

  <!-- After Send: a quiet nudge to look at the real wall -->
  <div class="afterglow" id="afterglow" hidden>
    <p class="ag-title">Look up</p>
    <p class="ag-sub">your light is on the lantern</p>
  </div>


  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
  <script src="config.js?v=11097"></script>
  <script src="layout.js?v=11097"></script>
  <script src="lw.js?v=11097"></script>
  <script src="ambient.js?v=11097"></script>
  <script src="lantern-art.js?v=11097"></script>
  <script src="controller.js?v=11097"></script>
</body>
</html>
